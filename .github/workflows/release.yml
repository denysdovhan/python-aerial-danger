name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:

      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v9

      - name: 🏷️ Set the distribution version from the release tag
        run: uv version "${GITHUB_REF_NAME#v}" --no-sync

      - name: 📦 Build distributions
        run: uv build --no-sources

      - name: 🔬 Test installed distributions
        run: |
          uv run --isolated --no-project --with dist/*.whl python tests/smoke.py
          uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke.py

      - name: 📤 Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aerial-danger
    permissions:
      id-token: write
    steps:

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v9

      - name: ⬇️ Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: 📤 Publish to PyPI
        run: uv publish --trusted-publishing always
