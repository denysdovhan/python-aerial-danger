name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:

      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v7

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --locked

      - name: 🧪 Run tests
        run: uv run --no-sync pytest

  quality:
    runs-on: ubuntu-latest
    steps:

      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v7

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v9

      - name: 📦 Install dependencies
        run: uv sync --locked

      - name: ⚙️ Check formatting
        run: uv run --no-sync ruff format --check .

      - name: ⚙️ Lint
        run: uv run --no-sync ruff check .

      - name: 📦 Build distributions
        run: uv build --no-sources

      - name: 🔬 Test installed distributions
        run: |
          uv run --isolated --no-project --with dist/*.whl python tests/smoke.py
          uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke.py
